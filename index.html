<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Un periódico independiente sobre economía, tecnología y cultura." />
  <title>The Free Press | Independent Student Journalism</title>
  <style>
    :root { --ink:#202020; --muted:#777; --line:#dad7d1; --paper:#fcfaf6; --accent:#8b2f2f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,'Times New Roman',serif; }
    a { color:inherit; } .container { max-width:1080px; margin:auto; padding:0 20px; }
    .kicker {font:11px Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; color:var(--muted);}
    header {text-align:center; padding:30px 0 15px; border-bottom:3px double var(--ink);}
    .masthead {font-size:clamp(36px,8vw,76px); font-weight:700; letter-spacing:-3px; margin:8px 0;}
    nav {display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:16px 0; border-bottom:1px solid var(--line); font:600 12px Arial,sans-serif; text-transform:uppercase; letter-spacing:1px;}
    nav a {text-decoration:none;} nav a:hover,nav a.active {color:var(--accent);}
    main {min-height:55vh;} section {padding:32px 0;} h1,h2,h3,p {margin-top:0;} h1 {font-size:clamp(28px,4vw,48px);} h2 {font-size:28px;} .lead {font-size:20px; line-height:1.55; max-width:720px;}
    .hero {border-bottom:1px solid var(--line); padding:45px 0;}
    .hero h1 {max-width:820px; line-height:1.06; margin:12px 0 16px;}
    .hero p {max-width:650px; line-height:1.55; color:#555;}
    .button {display:inline-block; margin-top:16px; padding:12px 18px; background:var(--ink); color:white; border:0; text-decoration:none; font:600 13px Arial,sans-serif; cursor:pointer;}
    .toolbar {display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 26px;} .filter {background:transparent; border:1px solid var(--line); padding:9px 12px; cursor:pointer; font:13px Arial,sans-serif;} .filter.active {background:var(--ink); color:white;}
    .grid {display:grid; grid-template-columns:repeat(3,1fr); gap:26px;} article {padding:18px 0; border-top:2px solid var(--ink);} article h3 {font-size:24px; line-height:1.2; margin:12px 0;} article p {font-size:15px; line-height:1.6; color:#555;} .meta {font:12px Arial,sans-serif; color:var(--muted);}
    .article-body {max-width:730px; margin:auto; font-size:19px; line-height:1.8;} .article-body h1 {line-height:1.1;} .article-body .back {font:13px Arial,sans-serif;}
    .panel {max-width:740px; padding:32px 0;} .panel p {line-height:1.7; font-size:18px;} footer {border-top:3px double var(--ink); padding:26px 0 35px; font:12px Arial,sans-serif; color:#666; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;}
    @media(max-width:750px){.grid{grid-template-columns:1fr}.masthead{letter-spacing:-1px;} nav{gap:12px}.hero{padding:30px 0;}}
  </style>
</head>
<body>
<div class="container">
  <header><div class="kicker">Independent Student Journalism</div><div class="masthead">THE FREE PRESS</div><div class="kicker">Technology · Economics · Culture</div></header>
  <nav aria-label="Navegación principal">
    <a href="#inicio" data-nav="inicio">Inicio</a><a href="#articulos" data-nav="articulos">Artículos</a><a href="#sobre" data-nav="sobre">Sobre el proyecto</a><a href="#contacto" data-nav="contacto">Contacto</a>
  </nav>
  <main id="app"></main>
  <footer><span>© <span id="year"></span> The Free Press. Proyecto editorial independiente.</span><span>Los textos de ejemplo deben sustituirse por artículos propios y contrastados.</span></footer>
</div>
<script>
  // EDITA AQUÍ TUS ARTÍCULOS. Cada entrada genera una tarjeta y una página de lectura.
  const articles = [
    {id:'ia-decisiones',category:'Tecnología',date:'Ejemplo de contenido',title:'¿Quién debe responder por las decisiones de una IA?',summary:'Una guía de las preguntas que deberíamos plantearnos antes de confiar en sistemas automatizados.',body:['Este texto es una demostración de diseño. Sustitúyelo por un artículo original que hayas investigado y contrastado.','Antes de publicar, consulta fuentes fiables, enlaza los datos y separa hechos de opiniones.']},
    {id:'economia-joven',category:'Economía',date:'Ejemplo de contenido',title:'Entender la economía empieza con hacer buenas preguntas',summary:'Cómo formular investigaciones sobre los problemas económicos de nuestra generación.',body:['Este es un texto de muestra, no un reportaje publicado. Aquí iría tu análisis con datos, entrevistas y fuentes comprobables.']},
    {id:'arte-futuro',category:'Cultura',date:'Ejemplo de contenido',title:'Por qué sigue importando la creación artística',summary:'Una mirada a la creatividad, la formación y las oportunidades culturales para jóvenes.',body:['Esta página de demostración muestra cómo se vería una publicación completa. Añade tu perspectiva original y evidencia.']}
  ];
  const app = document.getElementById('app');
  const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const card = a => `<article><div class="kicker">${escapeHtml(a.category)}</div><h3><a href="#leer/${encodeURIComponent(a.id)}">${escapeHtml(a.title)}</a></h3><p>${escapeHtml(a.summary)}</p><div class="meta">${escapeHtml(a.date)}</div></article>`;
  function render(){
    const route = decodeURIComponent(location.hash.slice(1)) || 'inicio';
    document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',route===a.dataset.nav));
    if(route==='inicio') app.innerHTML = `<section class="hero"><div class="kicker">Portada · Ideas que importan</div><h1>Un lugar para entender el mundo, no solo leer titulares.</h1><p>Un proyecto editorial independiente sobre tecnología, economía y cultura. Investigamos, preguntamos y explicamos.</p><a class="button" href="#articulos">Leer artículos →</a></section><section><div class="kicker">Edición de muestra</div><h2>Últimos artículos</h2><div class="grid">${articles.map(card).join('')}</div></section>`;
    else if(route==='articulos') {app.innerHTML=`<section><h1>Artículos</h1><p>Explora nuestras secciones.</p><div class="toolbar" id="filters"></div><div id="cards" class="grid"></div></section>`; const filters=['Todos',...new Set(articles.map(a=>a.category))]; const btnBox=document.getElementById('filters'); const cards=document.getElementById('cards'); function apply(selected){btnBox.innerHTML=filters.map(f=>`<button class="filter ${f===selected?'active':''}" data-filter="${escapeHtml(f)}">${escapeHtml(f)}</button>`).join('');cards.innerHTML=articles.filter(a=>selected==='Todos'||a.category===selected).map(card).join('');btnBox.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.filter)));}apply('Todos');}
    else if(route==='sobre') app.innerHTML=`<section class="panel"><div class="kicker">Nuestra misión</div><h1>Sobre el proyecto</h1><p>The Free Press es un proyecto de periodismo juvenil independiente. Queremos publicar explicaciones claras, análisis basados en pruebas y entrevistas originales sobre temas que afectan a nuestra generación.</p><p>Este sitio está en construcción y actualmente lo dirige una sola persona. Nuestro objetivo es publicar con rigor y sumar colaboradores cuando el proyecto esté preparado.</p></section>`;
    else if(route==='contacto') app.innerHTML=`<section class="panel"><div class="kicker">Escríbenos</div><h1>Contacto</h1><p>¿Tienes una propuesta de artículo, una corrección o te gustaría colaborar?</p><p>Crea un correo específico para el periódico y sustituye el enlace de ejemplo:</p><a class="button" href="mailto:contacto@ejemplo.com?subject=Contact%20The%20Free%20Press">Enviar un correo →</a><p class="meta" style="margin-top:16px">No publiques tu dirección personal ni tu teléfono en esta página.</p></section>`;
    else if(route.startsWith('leer/')) {const a=articles.find(a=>a.id===route.slice(5));app.innerHTML=a?`<section class="article-body"><a class="back" href="#articulos">← Todos los artículos</a><p class="kicker" style="margin-top:30px">${escapeHtml(a.category)} · ${escapeHtml(a.date)}</p><h1>${escapeHtml(a.title)}</h1><p class="lead">${escapeHtml(a.summary)}</p><hr>${a.body.map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</section>`:`<section><h1>No se encontró el artículo</h1><a href="#articulos">Volver</a></section>`;}
    else app.innerHTML='<section><h1>Página no encontrada</h1><a href="#inicio">Volver al inicio</a></section>';
    window.scrollTo(0,0);
  }
  document.getElementById('year').textContent=new Date().getFullYear();
  window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
